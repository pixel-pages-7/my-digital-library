<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Library</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #dbe7e4;
            color: #2c3e50;
            margin: 0;
            padding: 40px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: #1a1a2e;
            color: #e0e0e0;
        }

        body.dark-mode .card, body.dark-mode .modal-content, body.dark-mode .add-book-form, body.dark-mode .stat-card {
            background-color: #16213e;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3 { color: #ffffff; }
        body.dark-mode p { color: #a0a0a0; }
        body.dark-mode .search-input, body.dark-mode .form-input, body.dark-mode select {
            background-color: #0f3460;
            color: white;
            border-color: #0f3460;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 20px auto;
        }

        .theme-btn, .sort-btn, .genre-btn, .add-btn, .status-btn {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .theme-btn:hover, .sort-btn:hover, .genre-btn:hover, .add-btn:hover {
            background-color: #8e44ad;
        }

        .header-title { text-align: center; margin: 0; font-size: 32px; }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto 25px auto;
        }

        .stat-card {
            background: white;
            padding: 12px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            font-weight: bold;
        }

        .stat-num { font-size: 20px; color: #8e44ad; }

        .search-container { 
            text-align: center; 
            margin-bottom: 20px; 
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .genre-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-input {
            width: 300px;
            padding: 10px 15px;
            font-size: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 20px;
            outline: none;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto 50px auto;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-10px); }

        .fav-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .delete-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .book-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .tag {
            align-self: center;
            background-color: #e8daef;
            color: #8e44ad;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        h2 { margin: 5px 0 2px 0; font-size: 20px; }

        .author {
            font-size: 13px;
            font-style: italic;
            color: #8e44ad;
            margin-bottom: 8px;
        }

        p { color: #7f8c8d; font-size: 13px; margin-bottom: 8px; line-height: 1.4; }

        .page-count { font-size: 12px; color: #95a5a6; margin-bottom: 8px; }

        .rating { color: #f1c40f; font-size: 14px; margin-bottom: 10px; font-weight: bold; }

        .status-btn {
            background-color: #27ae60;
            margin-bottom: 8px;
            padding: 6px 10px;
            font-size: 12px;
        }
        .status-btn.unread {
            background-color: #e67e22;
        }

        button.read-btn {
            background-color: #8e44ad;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
        }

        .buy-btn {
            display: block;
            background: #e67e22;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            transition: 0.2s;
        }

        .buy-btn:hover {
            background: #d35400;
        }

        .add-book-section {
            max-width: 500px;
            margin: 0 auto;
        }

        .add-book-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-input, select {
            padding: 10px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            cursor: pointer;
            color: #aaa;
        }

        #loadingText {
            text-align: center;
            font-size: 18px;
            color: #8e44ad;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div></div>
        <h1 class="header-title">📚 Favorite Classic Books</h1>
        <button class="theme-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <!-- 📈 Dashboard Stats -->
    <div class="stats-container">
        <div class="stat-card">Books: <span id="totalStat" class="stat-num">0</span></div>
        <div class="stat-card">Favorites: <span id="favStat" class="stat-num">0</span></div>
        <div class="stat-card">Read: <span id="readStat" class="stat-num">0</span></div>
    </div>

    <!-- 🔍 Search & Sort -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" onkeyup="filterBooks()" placeholder="🔍 Search by title or author...">
        <button class="sort-btn" onclick="sortByPages()">📄 Sort by Pages</button>
    </div>

    <!-- 🏷️ Genre Filter -->
    <div class="genre-filter">
        <button class="genre-btn" onclick="filterGenre('all')">All</button>
        <button class="genre-btn" onclick="filterGenre('dystopian')">Dystopian</button>
        <button class="genre-btn" onclick="filterGenre('satire')">Political Satire</button>
        <button class="genre-btn" onclick="filterGenre('classic')">Classic Fiction</button>
    </div>

    <!-- Book Cards Container -->
    <div class="card-container" id="cardContainer">
        <div id="loadingText">⚡ Connecting to Firebase Database...</div>
    </div>

    <!-- ➕ Add Book Form -->
    <div class="add-book-section">
        <div class="add-book-form">
            <h3 style="text-align:center; margin:0 0 10px 0;">➕ Add New Book</h3>
            <input type="text" id="newTitle" class="form-input" placeholder="Book Title">
            <input type="text" id="newAuthor" class="form-input" placeholder="Author">
            <input type="number" id="newPages" class="form-input" placeholder="Page Count">
            <input type="text" id="newGenre" class="form-input" placeholder="Genre (e.g., Sci-Fi)">
            <select id="newRating" class="form-input">
                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                <option value="4">⭐⭐⭐⭐☆ (4/5)</option>
                <option value="3">⭐⭐⭐☆☆ (3/5)</option>
            </select>
            <input type="text" id="newImg" class="form-input" placeholder="Image URL">
            <input type="text" id="newQuote" class="form-input" placeholder="Favorite Quote">
            <input type="url" id="buyLink" class="form-input" placeholder="Buy Link (e.g., https://amazon.com/...)" />
            <input type="text" id="newDesc" class="form-input" placeholder="Book Description / Summary">
            <button class="add-btn" onclick="addNewBook()">Add Book</button>
        </div>
    </div>

    <!-- 💬 Modal Pop-up -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Book Title</h2>
            <h4 id="modalAuthor" style="color:#8e44ad; margin-top:0;">Author</h4>
            <p id="modalDesc" style="line-height:1.6; color:#555;">Book description goes here...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1️⃣ Firebase Config (შენი მონაცემებით)
        const firebaseConfig = {
            apiKey: "AIzaSyAjxbq9PhO1-GyEMjgLD1_m6_1zt5yGpbM",
            authDomain: "my-digital-library-d3592.firebaseapp.com",
            databaseURL: "https://my-digital-library-d3592-default-rtdb.firebaseio.com",
            projectId: "my-digital-library-d3592",
            storageBucket: "my-digital-library-d3592.firebasestorage.app",
            messagingSenderId: "1014803223867",
            appId: "1:1014803223867:web:9f7c7aaf558c30b38dd31e"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const booksRef = database.ref('books');

        let booksList = [];

        // 2️⃣ Listen for Realtime Changes in Firebase
        booksRef.on('value', (snapshot) => {
            const data = snapshot.val();
            booksList = [];

            if (data) {
                for (let id in data) {
                    booksList.push({ id: id, ...data[id] });
                }
            } else {
                // თუ ბაზა ცარიელია, ჩაასხას საწყისი 4 წიგნი
                seedInitialData();
            }

            renderBooks();
            updateStats();
        });

        // საწყისი წიგნები პირველი გაშვებისთვის
        function seedInitialData() {
            const defaultBooks = [
                { 
                    title: '1984', 
                    author: 'George Orwell', 
                    pages: 328, 
                    genre: 'dystopian', 
                    img: 'https://covers.openlibrary.org/b/isbn/0451524934-L.jpg', 
                    quote: 'Big Brother is watching you.',  
                    desc: 'A chilling dystopian novel set in a totalitarian society ruled by Big Brother, where critical thought is suppressed and truth is manipulated by the Party.',
                    rating: 5, 
                    buyLink: '',
                    isFav: false, 
                    isRead: false 
                },
                { 
                    title: 'Animal Farm', 
                    author: 'George Orwell', 
                    pages: 112, 
                    genre: 'satire', 
                    img: 'https://covers.openlibrary.org/b/isbn/0451526341-L.jpg', 
                    quote: 'All animals are equal, but some are more equal than others.', 
                    desc: 'A satirical allegorical novella reflecting events leading up to the Russian Revolution, told through a group of farm animals who rebel against their human farmer.',
                    rating: 4, 
                    buyLink: '',
                    isFav: false, 
                    isRead: true 
                },
                { 
                    title: 'To Kill a Mockingbird', 
                    author: 'Harper Lee', 
                    pages: 281, 
                    genre: 'classic', 
                    img: 'https://covers.openlibrary.org/b/isbn/0061120081-L.jpg', 
                    quote: 'Real courage is when you know you\'re licked before you begin.', 
                    desc: 'A classic story set in the American South addressing racial injustice and the loss of innocence through the eyes of young Scout Finch.',
                    rating: 5, 
                    buyLink: '',
                    isFav: true, 
                    isRead: true 
                },
                { 
                    title: 'Fahrenheit 451', 
                    author: 'Ray Bradbury', 
                    pages: 256, 
                    genre: 'dystopian', 
                    img: 'https://covers.openlibrary.org/b/isbn/9781451673319-L.jpg', 
                    quote: 'It was a pleasure to burn.', 
                    desc: 'A dystopian story about a future American society where books are outlawed and firemen burn any that are found.',
                    rating: 4, 
                    buyLink: '',
                    isFav: false, 
                    isRead: false 
                }
            ];

            defaultBooks.forEach(b => booksRef.push(b));
        }

        // 3️⃣ Render Books
        function renderBooks() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            if (booksList.length === 0) {
                container.innerHTML = '<p>No books available.</p>';
                return;
            }

            booksList.forEach(book => {
                const stars = '⭐'.repeat(book.rating) + '☆'.repeat(5 - book.rating);
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-pages', book.pages);
                card.setAttribute('data-genre', book.genre);

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteBook('${book.id}')">🗑️</button>
                    <button class="fav-btn" onclick="toggleFav('${book.id}', ${book.isFav})">${book.isFav ? '❤️' : '🤍'}</button>
                    <img class="book-img" src="${book.img}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
                    <span class="tag">${book.genre.toUpperCase()}</span>
                    <h2>${book.title}</h2>
                    <div class="author">by ${book.author}</div>
                    <p>"${book.quote}"</p>
                    <div class="page-count">📄 ${book.pages} pages</div>
                    <div class="rating">${stars} ${book.rating}/5</div>
                    <button class="status-btn ${book.isRead ? '' : 'unread'}" onclick="toggleRead('${book.id}', ${book.isRead})">
                        ${book.isRead ? '✓ Read' : '📖 Unread'}
                    </button>
                    <button class="read-btn" onclick="openModal('${book.title.replace(/'/g, "\\'")}', '${book.author.replace(/'/g, "\\'")}', '${(book.desc || book.quote).replace(/'/g, "\\'")}')">Read More</button>
                    ${book.buyLink ? `<a href="${book.buyLink}" target="_blank" class="buy-btn">🛒 Buy Book</a>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function updateStats() {
            document.getElementById('totalStat').innerText = booksList.length;
            document.getElementById('favStat').innerText = booksList.filter(b => b.isFav).length;
            document.getElementById('readStat').innerText = booksList.filter(b => b.isRead).length;
        }

        // Firebase-ში განახლებები
        function toggleFav(id, currentStatus) {
            database.ref('books/' + id).update({ isFav: !currentStatus });
        }

        function toggleRead(id, currentStatus) {
            database.ref('books/' + id).update({ isRead: !currentStatus });
        }

        function deleteBook(id) {
            if (confirm("Are you sure you want to delete this book?")) {
                database.ref('books/' + id).remove();
            }
        }

        function addNewBook() {
            let title = document.getElementById('newTitle').value.trim();
            let author = document.getElementById('newAuthor').value.trim();
            let pages = parseInt(document.getElementById('newPages').value) || 200;
            let genre = document.getElementById('newGenre').value.trim().toLowerCase() || 'classic';
            let rating = parseInt(document.getElementById('newRating').value) || 5;
            let img = document.getElementById('newImg').value.trim() || 'https://via.placeholder.com/200x300?text=Book+Cover';
            let quote = document.getElementById('newQuote').value.trim() || 'No quote added.';
            let buyLink = document.getElementById('buyLink').value.trim();
            let desc = document.getElementById('newDesc').value.trim() || 'No description available for this book.';

            if (!title || !author) {
                alert('Please enter both Title and Author!');
                return;
            }

            let newBook = { 
                title: title, 
                author: author, 
                pages: pages, 
                genre: genre, 
                rating: rating, 
                img: img, 
                quote: quote, 
                buyLink: buyLink,
                desc: desc,
                isFav: false, 
                isRead: false 
            };

            // Firebase-ში ახალი წიგნის გაგზავნა
            booksRef.push(newBook);

            // Clear Input Fields
            document.getElementById('newTitle').value = '';
            document.getElementById('newAuthor').value = '';
            document.getElementById('newPages').value = '';
            document.getElementById('newGenre').value = '';
            document.getElementById('newImg').value = '';
            document.getElementById('newQuote').value = '';
            document.getElementById('buyLink').value = '';
            document.getElementById('newDesc').value = '';
        }

        function filterBooks() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h2')[0].innerText.toLowerCase();
                let author = cards[i].getElementsByClassName('author')[0].innerText.toLowerCase();
                cards[i].style.display = (title.includes(input) || author.includes(input)) ? "flex" : "none";
            }
        }

        function filterGenre(genre) {
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let cardGenre = cards[i].getAttribute('data-genre');
                cards[i].style.display = (genre === 'all' || cardGenre.includes(genre)) ? "flex" : "none";
            }
        }

        let ascending = true;
        function sortByPages() {
            booksList.sort((a, b) => ascending ? a.pages - b.pages : b.pages - a.pages);
            ascending = !ascending;
            renderBooks();
        }

        function toggleTheme() { document.body.classList.toggle('dark-mode'); }
        function openModal(t, a, d) {
            document.getElementById('modalTitle').innerText = t;
            document.getElementById('modalAuthor').innerText = 'by ' + a;
            document.getElementById('modalDesc').innerText = d;
            document.getElementById('bookModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('bookModal').style.display = 'none'; }
    </script>

    <div style="text-align: center; margin: 30px 0; color: #777; font-size: 14px;">
        👀 Page Views: <img src="https://api.visitorbadge.io/api/visitors?path=pixel-pages-7.github.io&label=&countColor=%23555555" alt="visitor counter">
    </div>

</body>
</html>
